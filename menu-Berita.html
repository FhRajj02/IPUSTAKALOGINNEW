<script>
  // ---- Berita ----
  const news = [
    {tag:"Panduan", title:"Memaksimalkan layanan perpustakaan digital untuk tugas kuliah", date:"Senin, 24 Agustus 2026", color:"#2C4A47"},
    {tag:"Pelatihan", title:"Kelas singkat: menyusun sitasi otomatis dengan Mendeley", date:"Kamis, 20 Agustus 2026", color:"#C0932A"},
    {tag:"Kegiatan", title:"Sosialisasi sertifikasi pustakawan untuk staf unit kerja", date:"Jumat, 14 Agustus 2026", color:"#8FA893"},
    {tag:"Webinar", title:"Mengenali dan mencegah plagiarisme pada karya ilmiah", date:"Selasa, 11 Agustus 2026", color:"#B4472F"},
    {tag:"Pelatihan", title:"Workshop pengelolaan referensi tugas akhir bagi mahasiswa akhir", date:"Rabu, 5 Agustus 2026", color:"#2C4A47"},
    {tag:"Kegiatan", title:"Kunjungan studi banding unit perpustakaan digital kampus mitra", date:"Senin, 27 Juli 2026", color:"#8FA893"},
    {tag:"Panduan", title:"Cara meminjam dan memperpanjang e-book lewat Rak Pinjam", date:"Kamis, 23 Juli 2026", color:"#C0932A"},
    {tag:"Pengumuman", title:"Penambahan 300 judul koleksi ilmu terapan dan kedokteran", date:"Senin, 13 Juli 2026", color:"#B4472F"},
  ];
  const newsGrid = document.getElementById('news-grid');
  news.forEach(n=>{
    const el = document.createElement('div');
    el.className = 'news-card';
    el.innerHTML = `
      <div class="news-image" style="background:${n.color}">
        <svg viewBox="0 0 24 24" fill="none" stroke="#F8F5EE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5c3-1.5 6-1.5 8 0v14c-2-1.5-5-1.5-8 0z"/><path d="M20 5c-3-1.5-6-1.5-8 0v14c2-1.5 5-1.5 8 0z"/></svg>
      </div>
      <div class="news-body">
        <div class="news-tag">${n.tag}</div>
        <p class="news-title">${n.title}</p>
        <div class="news-date">${n.date}</div>
      </div>
    `;
    newsGrid.appendChild(el);
  });
</script>
